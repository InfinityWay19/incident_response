apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-nginx
spec:
  replicas: 3 # 👈 МАГИЯ K8S: Мы говорим "хочу 3 копии Nginx"
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        volumeMounts: 
        - name: html-volume
          mountPath: /usr/share/nginx/html
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SLACK_WEBHOOK_URL
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
      volumes:
      - name: html-volume
        configMap:
          name: incident-nginx-html