name: Build and Push Backend

# 1. Запуск воркфлоу только при пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      
      # 2. Скачиваем код репозитория на виртуальную машину GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Настраиваем Docker Buildx (нужен для продвинутого кэширования и сборки)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Авторизуемся в Docker Hub, используя секреты репозитория
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 5. Собираем Docker-образ и отправляем его в Docker Hub
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Замените 'username' на ваш реальный логин в Docker Hub, а 'backend-repo' на имя вашего репозитория там
          tags: |
            ${{ secrets.DOCKERHUB_LOGIN }}/incident_response:latest
            ${{ secrets.DOCKERHUB_LOGIN }}/incident_response:${{ github.sha }}
      - name: Update Helm Values
        run: |
            sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" incident-chart/values.yaml
            git config user.name "Github Actions Bot"
            git config user.email "actions@github.com"
            git add incident-chart/values.yaml
            git commit -m "chore: update backend image tag to ${{ github.sha }}"
            git push
