services:
  postgres_db:
    image: postgres:16-alpine
    container_name: incident_db
    restart: unless-stopped
    environment: 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: incident_response
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident_backend
    restart: unless-stopped
    depends_on:
      - postgres_db
    env_file:
      - ./backend/.env
    command: sh -c "pnpm exec prisma migrate deploy && node dist/main.js"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident_frontend
    restart: unless-stopped
    depends_on:
      - backend
  adminer:
    image: adminer:latest
    container_name: incident_adminer
    restart: always
    ports:
      - "8081:8080"
#    networks:
#      - incident_network
    depends_on:
      - postgres_db
# ==========================================
  # 4. СБОРЩИК МЕТРИК (Prometheus)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: incident_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # ==========================================
  # 5. ДАШБОРДЫ (Grafana)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: incident_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000" # Пробрасываем на 3001, так как 3000 занят бэкендом
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: incident_cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
  gateway:
    image: nginx:alpine
    container_name: incident_gateway
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./gateway/certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
  loki:
    image: grafana/loki:latest
    container_name: incident_loki
    restart: always
    ports:
     - "3100:3100"
  promtail:
    image: grafana/promtail:latest
    container_name: incident_promtail
    restart: always
    volumes:
     - /var/run/docker.sock:/var/run/docker.sock
     - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
     - loki
  alert_manager:
    image: prom/alertmanager:latest
    container_name: incident_alertmanager
    restart: always
    ports:
     - "9093:9093"
    volumes:
     - ./monitoring/alert_manager.yml:/etc/alert_manager/alert_manager.yml
     - ./monitoring/slack_webhook.txt:/etc/alert_manager/slack_webhook.txt
    command:
     - '--config.file=/etc/alert_manager/alert_manager.yml'

volumes:
  pg_data:
  promdata:
  grafanadata: