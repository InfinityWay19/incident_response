apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000" # Порт приложения
        prometheus.io/path: "/metrics"
      labels:
        app: backend
    spec:
      containers:
      - name: nestjs-api
        image: {{ .Values.backend.image }}:{{ .Values.backend.tag }}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          value: "postgresql://incident_user:SuperStrongPassword123!@postgres-db-service:5432/incident_response_db?schema=public"
        - name: TELEGRAM_BOT_TOKEN
          value: "8768110429:AAEdAJLiHyMzJqGraWIVKblE2Cq6HarqKfo"
        - name: TELEGTAM_CHAT_ID
          value: "-1003941335705"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: NODE_ENV
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_PORT
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_USER
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80        # Порт внутри кластера
      targetPort: 3000 # Порт внутри контейнера NestJS
      nodePort: 30081  # Порт, который будет доступен на localhost (диапазон 30000-32767)