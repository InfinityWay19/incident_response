apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: incident-backend-hpa
    namespace: default
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: incident-backend
    minReplicas: 2
    maxReplicas: 10
    metrics:
        - type: Resource
          resource:
            name: cpu
            target:
                type: Utilization
                averageUtilization: 60