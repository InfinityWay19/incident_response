apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80        # Порт внутри кластера
      targetPort: 3000 # Порт внутри контейнера NestJS
      nodePort: 30081  # Порт, который будет доступен на localhost (диапазон 30000-32767)