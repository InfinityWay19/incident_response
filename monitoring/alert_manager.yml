route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'slack_oncall'

receivers:
  - name: 'slack_oncall'
    slack_configs:
      - api_url_file: '/etc/alert_manager/slack_webhook.txt'
        channel: '#alerts'
        send_resolved: true
        title: |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}
        text: >-
          {{ range .Alerts -}}
          *Описание:* {{ .Annotations.description }}
          *Детали:* `{{ .Labels }}`
          {{ end }}