global:
  scrape_interval: 5s # Как часто Prometheus опрашивает сервисы

rule_files:
  - 'alert_rules.yml'
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alert_manager:9093']

scrape_configs:
  # 1. Prometheus мониторит сам себя
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Prometheus мониторит наш NestJS бэкенд по Docker-сети!
  - job_name: 'incident-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3000']

  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']